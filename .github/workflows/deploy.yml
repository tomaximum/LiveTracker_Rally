name: Deploy LiveTrack Rally (Cloud v3.1.4)

on:
  push:
    branches: [ master, testing ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Inject GitHub Secrets
        run: |
          # Create js directory if not exists
          mkdir -p js
          # Create secrets.js using safe here-doc to avoid envsubst issues
          cat <<EOF > js/secrets.js
          /**
           * LiveTrack Rally v3.1.4 - Injected Secrets
           * Generated by GitHub Actions
           */
          const SECRETS = {
              TELEGRAM_ADMIN_TOKEN: "${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}",
              TELEGRAM_ADMIN_CHAT_ID: "${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}",
              GDRIVE_WEBHOOK_URL: "${{ secrets.GDRIVE_WEBHOOK_URL }}"
          };
          console.log("LiveTrack: Cloud Secrets successfully loaded.");
          EOF
          echo "✅ Secrets created in js/secrets.js"

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4
        
      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

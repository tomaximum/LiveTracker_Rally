name: Deploy LiveTrack Rally (Cloud v3.1.0)

on:
  push:
    branches: [ master, testing ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Inject GitHub Secrets
        run: |
          # Use envsubst to replace placeholders in the template
          envsubst < js/secrets.template.js > js/secrets.js
          echo "✅ Secrets injected into js/secrets.js"
        env:
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true

name: Deploy LiveTrack Rally (Cloud v3.1.9)

on:
  push:
    branches: [ master, testing ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Inject GitHub Secrets
        env:
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
        run: |
          mkdir -p js
          python3 - <<'PYEOF'
import os

token = os.environ.get('TELEGRAM_ADMIN_BOT_TOKEN', '')
chat_id = os.environ.get('TELEGRAM_ADMIN_CHAT_ID', '')
drive_url = os.environ.get('GDRIVE_WEBHOOK_URL', '')

content = f"""// LiveTrack Rally v3.1.9 - Injected by GitHub Actions
// DO NOT EDIT MANUALLY - regenerated on every deploy
const SECRETS = {{
    TELEGRAM_ADMIN_TOKEN: {repr(token)},
    TELEGRAM_ADMIN_CHAT_ID: {repr(chat_id)},
    GDRIVE_WEBHOOK_URL: {repr(drive_url)}
}};
console.log('[LiveTrack] Cloud Secrets loaded. Bot B token present:', SECRETS.TELEGRAM_ADMIN_TOKEN.length > 0);
"""

with open('js/secrets.js', 'w') as f:
    f.write(content)

print('Secrets written:')
print(f'  TELEGRAM_ADMIN_TOKEN : {"OK (" + str(len(token)) + " chars)" if token else "MISSING"}')
print(f'  TELEGRAM_ADMIN_CHAT_ID: {"OK" if chat_id else "MISSING"}')
print(f'  GDRIVE_WEBHOOK_URL    : {"OK" if drive_url else "MISSING"}')
PYEOF

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4
        
      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
